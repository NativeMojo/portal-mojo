name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run verify:release
      - run: npm run build:admin -- --canonical
      - name: Name Admin artifact
        id: admin
        run: node -e 'const m=require("./dist/admin/admin-artifact.json"); require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `name=portal-mojo-admin-${m.version}-${m.source_revision}\n`)'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.admin.outputs.name }}
          path: dist/admin/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
